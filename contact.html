<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bindushree</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Bindu<span>shree.</span></a>
        <div class="menu-toggle"><i class="fas fa-bars"></i></div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="education.html">Education</a>
            <a href="certification.html">Certification</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <section class="fade-in">
            <h2 class="section-title">Get In Touch</h2>
            <div class="contact-container fade-in" style="transition-delay: 0.1s;">
                <p style="font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem;">
                    I'm currently open for new opportunities. Whether you have a question, a project idea, or just want to say hi, I'll try my best to get back to you!
                </p>

                <a href="mailto:hello@example.com" class="btn btn-primary btn-large" style="font-size: 1.2rem; padding: 1rem 3rem;">
                    <i class="fas fa-paper-plane" style="margin-right: 10px;"></i> Say Hello
                </a>

                <div class="contact-links">
                    <a href="#" class="contact-item">
                        <div class="contact-icon"><i class="fab fa-linkedin-in"></i></div>
                        <span>LinkedIn</span>
                    </a>
                    <a href="#" class="contact-item">
                        <div class="contact-icon"><i class="fab fa-github"></i></div>
                        <span>GitHub</span>
                    </a>
                    <a href="mailto:hello@example.com" class="contact-item">
                        <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                        <span>Email</span>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
